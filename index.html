<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tamil Nadu Police Department - Demo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #061a33, #174b7a);
            padding: 20px;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* POLICE LOGO */
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            font-size: 21px;
            color: #0b2d50;
            margin-bottom: 6px;
        }

        h2 {
            font-size: 14px;
            color: #777;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .demo {
            background: #fff3cd;
            border: 1px solid #ffe08a;
            color: #856404;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 7px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #174b7a;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #0b2d50;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #174d80;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
        }

        footer {
            margin-top: 25px;
            font-size: 11px;
            color: #888;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- TAMIL NADU POLICE LOGO -->
        <div class="logo">
            <img src="tnpolice-logo.png"
                 alt="Tamil Nadu Police Department Demo Logo">
        </div>

        <h1>TAMIL NADU POLICE DEPARTMENT</h1>

        <h2>Login Portal — DEMO</h2>

        <div class="demo">
            <strong>DEMO PAGE</strong><br>
            Do not enter real usernames or passwords.
        </div>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
                autocomplete="off"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="off"
                required
            >

            <button type="submit">
                LOGIN
            </button>

        </form>

        <div id="message"></div>

        <footer>
            Demonstration / Educational Mockup Only<br>
            No username or password is collected or stored.
        </footer>

    </div>


    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            document.getElementById("message").textContent =
                "Demo login only — no credentials were submitted or stored.";

            document.getElementById("message").style.color = "#0b6b2a";

        });
    </script>

</body>
</html>
